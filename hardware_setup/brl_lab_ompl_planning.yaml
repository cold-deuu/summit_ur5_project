planning_plugin: ompl_interface/OMPLPlanner
request_adapters: >-
  default_planner_request_adapters/AddIterativeSplineParameterization
  default_planner_request_adapters/ResolveConstraintFrames
  default_planner_request_adapters/FixWorkspaceBounds
  default_planner_request_adapters/FixStartStateBounds
  default_planner_request_adapters/FixStartStateCollision
  default_planner_request_adapters/FixStartStatePathConstraints
start_state_max_bounds_error: 0.05
planner_configs:
  RRTConnect:
    type: geometric::RRTConnect
    range: 0.0
manipulator:
  default_planner_config: RRTConnect
  planner_configs: [RRTConnect]
  # MoveIt default with the real +-360 deg UR ranges. In MoveIt 1.1 this sets both the
  # collision-check step and the output point count. BRL's point limits are bypassed in the
  # lab (ignore_max_points), so keep the finer default check. Never use 0.05 (brl_sim).
  longest_valid_segment_fraction: 0.005
