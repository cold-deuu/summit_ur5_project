# BRL_lab IK: TRAC-IK instead of KDL. With KDL, move_group's pose-goal sampler made 0 sampling
# attempts (BRL pre-pick "Unable to sample any valid states for goal tree") although
# compute_ik solved; "Distance" prefers solutions near the seed (current posture).
manipulator:
  kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
  kinematics_solver_timeout: 0.05
  solve_type: Distance
