  acceleration: [0.3, 0.3, 0.3, 0.4, 0.4, 0.4]
  jerk: [3, 3, 3, 4, 4, 4] # retimed reference only
admittance:
  wrench_sign: 1.0
  sensor_to_wrist_xyz: [0, 0, 0]
