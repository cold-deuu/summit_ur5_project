# BRL_lab action/MoveIt admittance gains (copied from ur5e_field_action.yaml).
admittance:
  # [BRL_lab] bound admittance offsets (0.10 m / 0.30 rad below); field copy keeps this off.
  displacement_limits_enabled: true
  acceleration_limits_enabled: false
  smooth_input: true
  mass: [5, 5, 5, 0.5, 0.5, 0.5]
  damping: [75, 75, 75, 5, 5, 5]
  stiffness: [150, 150, 150, 2, 2, 2]
  deadband: [2, 2, 2, 0.15, 0.15, 0.15]
  cutoff_hz: 4.0
  velocity_limit: [0.06, 0.06, 0.06, 0.08, 0.08, 0.08]
  linear_velocity_norm_limit: 0.08
  angular_velocity_norm_limit: 0.10
  acceleration_limit: [0.15, 0.15, 0.15, 0.5, 0.5, 0.5]
  displacement_limit: [0.10, 0.10, 0.10, 0.30, 0.30, 0.30]
  joint_velocity_limit: 0.15
  joint_acceleration_limit: 0.40
  idle_reference_lag: 0.005
  wrench_sign: 1.0
  sensor_offset_x: 0.0
  sensor_offset_y: 0.0
  sensor_offset_z: 0.0
  sensor_to_wrist_rpy: [0, 0, 0]
