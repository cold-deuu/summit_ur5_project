# Existing CartesianAdmittance; finite, smooth action/HOLD settings for UR5e.
# Translational units: kg, N*s/m, N/m, m, m/s, m/s^2. Rotation: rad equivalents.
admittance:
  smooth_input: true
  mass: [5, 5, 5, 0.5, 0.5, 0.5]
  damping: [20, 20, 20, 0.8, 0.8, 0.8]
  stiffness: [0, 0, 0, 0, 0, 0]
  deadband: [2, 2, 2, 0.15, 0.15, 0.15]
  cutoff_hz: 4.0
  velocity_limit: [0.02, 0.02, 0.02, 0.08, 0.08, 0.08]
  linear_velocity_norm_limit: 0.03
  angular_velocity_norm_limit: 0.10
  acceleration_limit: [0.15, 0.15, 0.15, 0.5, 0.5, 0.5]
  displacement_limit: [0.10, 0.10, 0.10, 0.30, 0.30, 0.30]
  # Separate force-response joint limits from nominal tracking's 1.57 rad/s cap.
  joint_velocity_limit: 0.15
  joint_acceleration_limit: 0.40
  # Hold anti-windup: retained position cannot build up while hardware lags.
  idle_reference_lag: 0.005
