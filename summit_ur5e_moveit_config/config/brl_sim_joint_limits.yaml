# BRL sim stand-in planner only. HQP retimes every path (TOPP-RA), so these only
# shape the planned timestamps; scaling 1.0 avoids the Noetic 0.1 default.
default_velocity_scaling_factor: 1.0
default_acceleration_scaling_factor: 1.0
joint_limits:
  ur5e_shoulder_pan_joint:
    has_velocity_limits: true
    max_velocity: 0.36
    has_acceleration_limits: true
    max_acceleration: 0.72
  ur5e_shoulder_lift_joint:
    has_velocity_limits: true
    max_velocity: 0.36
    has_acceleration_limits: true
    max_acceleration: 0.72
  ur5e_elbow_joint:
    has_velocity_limits: true
    max_velocity: 0.36
    has_acceleration_limits: true
    max_acceleration: 0.72
  ur5e_wrist_1_joint:
    has_velocity_limits: true
    max_velocity: 0.45
    has_acceleration_limits: true
    max_acceleration: 0.9
  ur5e_wrist_2_joint:
    has_velocity_limits: true
    max_velocity: 0.45
    has_acceleration_limits: true
    max_acceleration: 0.9
  ur5e_wrist_3_joint:
    has_velocity_limits: true
    max_velocity: 0.45
    has_acceleration_limits: true
    max_acceleration: 0.9
