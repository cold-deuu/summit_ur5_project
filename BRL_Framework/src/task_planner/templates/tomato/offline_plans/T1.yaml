# Two fixed logged tomatoes: tomato1 -> place, tomato2 -> discard.
offline_actions:
  - index: 1
    name: prepare_nav(brl_robot)
  - index: 2
    name: detect(brl_robot, stem_01)
  - index: 3
    name: pick(brl_robot, tomato1, stem_01)
  - index: 4
    name: scan(brl_robot, tomato1)
  - index: 5
    name: place(brl_robot, tomato1)
  - index: 6
    name: pick(brl_robot, tomato2, stem_01)
  - index: 7
    name: scan(brl_robot, tomato2)
  - index: 8
    name: discard(brl_robot, tomato2)
  - index: 9
    name: prepare_nav(brl_robot)
